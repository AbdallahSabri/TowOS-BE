# Local-only Postgres/Redis/RabbitMQ for the integration test suite. Not
# part of the deploy pipeline (BE-SPEC §3: "No Dockerfile in this repo.
# Coolify builds it.") - this is dev/test tooling only.
#
# Usage: docker compose -f docker-compose.test.yml up -d
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: towos_test
    ports:
      # Host port 5433, not 5432: keeps this out of the way of any other
      # local Postgres (Supabase's local stack, a system install, ...).
      - '5433:5432'
    volumes:
      - ./scripts/test-db-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:8
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 15

  rabbitmq:
    image: rabbitmq:4.3-management
    ports:
      - '5673:5672'
      - '15673:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 2s
      timeout: 5s
      retries: 20
